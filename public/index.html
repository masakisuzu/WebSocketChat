<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <style>
      .chat {
        display: flex;
        flex-direction: column;
        height: 80vh;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .form {
        display: flex;
      }
      .input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
      }
      .submit {
        padding: 10px;
        border: 1px solid #ccc;
        background: #eee;
        cursor: pointer;
      }
      .palette {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        align-items: center;
      }
      .color-btn {
        width: 64px;   /* ← ここで色ボタンのサイズを指定 */
        height: 64px;
        border-radius: 50%;
        border: 3px solid transparent;
        cursor: pointer;
      }
      .color-btn.selected {
        border-color: #333;
        outline: 2px solid #aaa;
      }
      .size-palette {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        align-items: center;
      }
      .size-btn {
        width: 64px;   /* ← ここで太さボタンのサイズを指定 */
        height: 64px;
        border-radius: 8px;
        border: 3px solid transparent;
        background: #eee;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .size-btn.selected {
        border-color: #333;
        outline: 2px solid #aaa;
      }
    </style>
  </head>
  <body>
    <div class="chat">
      <ul class="messages"></ul>
      <form class="form">
        <input class="input" autocomplete="off" />
        <button class="submit">Send</button>
      </form>
    </div>

    <div class="palette">
      <button class="color-btn selected" data-color="#000000" style="background:#000000"></button>
      <button class="color-btn" data-color="#e74c3c" style="background:#e74c3c"></button>
      <button class="color-btn" data-color="#3498db" style="background:#3498db"></button>
      <button class="color-btn" data-color="#2ecc71" style="background:#2ecc71"></button>
      <button class="color-btn" data-color="#f39c12" style="background:#f39c12"></button>
      <button class="color-btn" data-color="#9b59b6" style="background:#9b59b6"></button>
      <button class="color-btn" data-color="#ffffff" style="background:#ffffff; border-color:#ccc"></button>
    </div>

    <div class="size-palette">
      <button class="size-btn selected" data-size="3">細</button>
      <button class="size-btn" data-size="8">中</button>
      <button class="size-btn" data-size="16">太</button>
      <button class="size-btn" data-size="32">極太</button>
    </div>

    <canvas
      id="canvas"
      width="600"
      height="600"
      style="border: solid 1px black"
    ></canvas>

    <script>
      function main() {
        const host = location.origin.replace(/^http/, 'ws')
        const ws = new WebSocket(host + '/ws')
        const myId = self.crypto.randomUUID().substr(0, 8)

        const canvas = document.getElementById('canvas')
        const ctx = canvas.getContext('2d')

        let drawing = false
        let currentColor = '#000000'
        let currentSize = 3  // ← 選択中の太さ

        document.querySelectorAll('.color-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn').forEach((b) => b.classList.remove('selected'))
            btn.classList.add('selected')
            currentColor = btn.dataset.color
          })
        })

        // 太さボタンのクリック処理（色ボタンとほぼ同じ仕組み）
        document.querySelectorAll('.size-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.size-btn').forEach((b) => b.classList.remove('selected'))
            btn.classList.add('selected')
            currentSize = Number(btn.dataset.size)  // ← data-sizeを数値として取得
          })
        })

        canvas.addEventListener('mousedown', (e) => {
          sendDrawingEvent(e.offsetX, e.offsetY, 'mousedown')
        })
        function mousedown() {
          drawing = true
          ctx.beginPath()
        }

        canvas.addEventListener('mousemove', (e) => {
          if (drawing) {
            sendDrawingEvent(e.offsetX, e.offsetY, 'mousemove')
          }
        })
        function mousemove(x, y, color, size) {
          if (drawing) {
            draw(x, y, true, color, size)
          }
        }

        canvas.addEventListener('mouseup', (e) => {
          sendDrawingEvent(e.offsetX, e.offsetY, 'mouseup')
        })
        function mouseup() {
          drawing = false
          ctx.beginPath()
        }

        canvas.addEventListener('mouseout', (e) => {
          sendDrawingEvent(e.offsetX, e.offsetY, 'mouseout')
        })
        function mouseout() {
          drawing = false
        }

        function draw(x, y, dragging, color, size) {
          ctx.strokeStyle = color || '#000000'
          ctx.lineWidth = size || 3  // ← sizeを適用
          ctx.lineCap = 'round'      // ← 線の端を丸くすると綺麗
          if (dragging) {
            ctx.lineTo(x, y)
            ctx.stroke()
          } else {
            ctx.moveTo(x, y)
          }
        }

        function sendDrawingEvent(x, y, control) {
          const message = JSON.stringify({
            id: myId, x, y, control, type: 'paint',
            color: currentColor,
            size: currentSize  // ← sizeも送信
          })
          ws.send(message)
        }

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data)
          if (msg.type === 'paint') {
            const { x, y, control, color, size } = msg  // ← sizeも受け取る
            if (control === 'mousedown') {
              mousedown()
            } else if (control === 'mouseup') {
              mouseup()
            } else if (control === 'mousemove') {
              mousemove(x, y, color, size)  // ← sizeも渡す
            } else if (control === 'mouseout') {
              mouseout()
            }
          }
          if (msg.type === 'chat') {
            const { id, text } = msg
            const messageList = document.querySelector('.messages')
            const li = document.createElement('li')
            if (id === myId) {
              li.textContent = `(${id})自分:` + text
            } else {
              li.textContent = id + ': ' + text
            }
            messageList.appendChild(li)
          }
        }

        const form = document.querySelector('.form')
        form.onsubmit = function (e) {
          e.preventDefault()
          const input = document.querySelector('.input')
          const text = input.value
          ws.send(JSON.stringify({ id: myId, text, type: 'chat' }))
          input.value = ''
          input.focus()
        }

        ws.onerror = function (error) {
          console.error('WebSocket Error: ', error)
        }
      }

      main()
    </script>
  </body>
</html>
